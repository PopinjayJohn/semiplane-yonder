name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1070
      - name: templ generate + diff check
        run: |
          templ generate
          git diff --exit-code
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
      - name: unit + fuzz-short
        run: go test ./...
      # snapshot + axe land in Lane E2 (Phase 1); placeholders below.
      - name: snapshot (stub)
        run: go build ./...
