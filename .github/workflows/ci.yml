name: check

on:
  push:
  pull_request:

env:
  GO_VERSION: "1.27"
  TEMPL_VERSION: v0.3.1070
  NODE_VERSION: "22"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
      - name: templ generate + diff check
        run: |
          templ generate
          git diff --exit-code
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
      - name: unit tests (incl. 5k bench harness + migration runner)
        run: go test ./...
      - name: fuzz-short
        run: make fuzz-short
      - name: budgets
        run: make budgets

  snapshot:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
      - name: templ generate
        run: templ generate
      - name: goreleaser snapshot (3-OS, no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  axe:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Node is confined to this job (spec §2: no Node in the binary).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: axe on P01 pages (skips until pages are served)
        run: ./tools/axe/check.sh

  serve-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: serve-after-init smoke (guest/owner/GM matrix over HTTP)
        run: ./tools/serve-smoke.sh
