  - second-wind-2024
  - weapon-mastery-2024

# Feature plugins (P06 namespace — listed so neither lane's keys trip the
# other's validation). The random-tables slot mounts when enabled.
enabled-plugins:
  - random-tables

# Opened by `/` (redirects to /p/<landing-page>).
landing-page: welcome
